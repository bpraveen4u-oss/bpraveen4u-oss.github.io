<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <meta name="description" content="The personal website of Praveen.">
  <title>Praveen | Personal Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #242522;
      background: #f5f3ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 72px);
      border: 1px solid #e4e0d8;
      border-radius: 24px;
      background: #fffefa;
      box-shadow: 0 24px 70px rgb(46 42 32 / 8%);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #73746d;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 5rem);
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .intro {
      max-width: 42ch;
      margin: 24px 0 32px;
      color: #5b5d56;
      font-size: clamp(1.05rem, 3vw, 1.2rem);
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #fffefa;
      background: #292b27;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    a:hover {
      background: #454940;
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid #8a9b70;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal website</p>
    <h1>Hi, I'm Praveen.</h1>
    <p class="intro">Welcome to my corner of the web. I'm glad you stopped by.</p>
    <a href="https://github.com/bpraveen4u-oss">Find me on GitHub <span aria-hidden="true">-&gt;</span></a>
  </main>
</body>
</html>
